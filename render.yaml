databases:
  - name: mealmate-db
    databaseName: mealmate
    user: mealmate
    plan: free

services:
  - type: web
    name: mealmate
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn mealmate.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mealmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
