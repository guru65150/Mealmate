<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Compact Modern Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 1.5rem;
            max-width: 950px;
            margin: 0 auto;
            font-size: 0.85rem; /* Smaller global font size */
        }

        /* Compact Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.08);
            border: none !important;
            margin-bottom: 2rem;
        }

        thead {
            background-color: #f1f5f9;
        }

        th {
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 0.6rem 0.8rem;
            text-align: left;
            border: none;
        }

        td {
            padding: 0.6rem 0.8rem;
            vertical-align: middle;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 0.85rem;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Smaller Item Images */
        td img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #e2e8f0;
        }

        /* Compact Heading */
        h2 {
            font-size: 1.15rem;
            color: #1e293b;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        /* Compact Form Card */
        form {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.08);
            width: 100%;
        }

        /* Form Labels */
        label {
            display: inline-block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }

        /* Compact Inputs & Textareas */
        input[type="text"],
        input[type="number"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #334155;
            background-color: #f8fafc;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        /* Checkbox */
        input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #3b82f6;
            vertical-align: middle;
            margin-left: 0.4rem;
            cursor: pointer;
        }

        /* Compact Submit Button */
        button[type="submit"] {
            display: block;
            width: 100%;
            background-color: #3b82f6;
            color: white;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: #2563eb;
        }

        /* Control spacing for original break tags */
        br {
            display: block;
            content: "";
            margin-top: 0.4rem;
        }
    </style>
</head>
<body>
    
    <!-- show current menu -->
    <table border="1">
        <thead>
            <tr>
                <th>Item name</th>
                <th>Picture</th>
                <th>Description</th>
                <th>Price</th>
                <th>Is veg/</th>
            </tr>
        </thead>
        <tbody>
            {%  for item in itemList %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>
                        <img src="{{ item.picture }}">
                    </td>
                    <td>{{ item.description }}</td>
                    <td>{{ item.price }}</td>
                    <td>{{ item.vegeterian }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>


    <!-- add food item (form) -->
    <h2>Add Menu Item</h2>
    <form action="{% url 'update_menu' restaurant.id %}" method="post">
        {% csrf_token %}
        <label for="name">Item Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" step="0.01" required><br><br>

        <label for="vegeterian">Vegetarian:</label>
        <input type="checkbox" id="vegeterian" name="vegeterian"><br><br>

        <label for="picture">Image URL:</label>
        <input type="url" id="picture" name="picture"><br><br>

        <button type="submit">Add Item</button>
    </form>
</body>
</html>
