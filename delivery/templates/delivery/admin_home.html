<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <style>
        /* Modern CSS Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Container Card */
        .admin-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Welcome Heading */
        h3 {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Action Links styled as Buttons */
        a {
            display: block;
            width: 100%;
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        a:hover {
            background-color: #2563eb;
        }

        a:active {
            transform: scale(0.98);
        }

        /* Spacing between buttons (replacing <br><br>) */
        a + br + br + a, 
        a + br {
            display: block;
            margin-top: 1rem;
        }

        /* Clean up raw br tags behavior */
        br {
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h3>Welcome to Admin HOME!</h3>

        <a href="open_add_restaurant">ADD NEW RESTAURANT</a>
        <br><br>
        <a href="open_show_restaurant">SHOW RESTAURANTS</a>
    </div>
</body>
</html>
