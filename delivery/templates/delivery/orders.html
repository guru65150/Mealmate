<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Order Summary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            /* 🎨 Modern Vibrant Gradient Background */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .success-checkmark {
            width: 68px;
            height: 68px;
            background-color: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
        }
        .card h1 {
            font-size: 23px;
            color: #111827;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            margin-bottom: 6px;
            font-weight: 600;
        }
        /* Delivery Address text */
        .card p:first-of-type {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 18px;
        }
        /* Delivery Note box */
        .card p:last-of-type {
            font-size: 14px;
            color: #4b5563;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        /* Action Button */
        .card a {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #528FF0 0%, #3b76d0 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(82, 143, 240, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(82, 143, 240, 0.5);
        }
        .card a:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-checkmark">✓</div>

        <h1>Thank you for your order, {{ username }}!</h1>

        <h2>Delivery Address</h2>
        <p>{{ customer.address }}</p>

        <p>Your order will be delivered to this location shortly. Thank you for choosing Meal Mate!</p>

        {% if cart_items %}
            <a href="{% url 'customer_menu' cart_items.0.restaurant.id username %}">Back to Restaurants</a>
        {% else %}
            <a href="/">Back to Home</a>
        {% endif %}
    </div>
</body>
</html>
